<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ContactScope — Administrator Login</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6f1">
    <section style="width:min(430px,100%);background:#fff;border:1px solid #dfe2d8;border-radius:24px;padding:32px;box-shadow:0 20px 70px rgba(20,23,16,.12)">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#171914;font-weight:850">
        <span style="display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#151713;color:#d8ff57;font-weight:900">C</span>
        ContactScope
      </a>
      <p style="margin:28px 0 6px;color:#7a8075;font-size:11px;font-weight:850;letter-spacing:.12em">RESTRICTED AREA</p>
      <h1 style="margin:0 0 8px;font-size:32px">Administrator login</h1>
      <p style="margin:0 0 24px;color:#73796f;font-size:13px">Use the administrator credentials configured on the server. Customer accounts cannot enter this area.</p>
      <form id="adminLoginForm">
        <label style="display:block;font-size:12px;font-weight:750;margin:0 0 14px">Administrator email
          <input id="adminEmail" type="email" autocomplete="username" required style="width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d5d8cd;border-radius:10px">
        </label>
        <label style="display:block;font-size:12px;font-weight:750;margin:0 0 14px">Administrator password
          <input id="adminPassword" type="password" autocomplete="current-password" required style="width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d5d8cd;border-radius:10px">
        </label>
        <div id="adminLoginError" style="display:none;background:#fff0ee;color:#b43b2f;padding:10px;border-radius:9px;font-size:12px;margin-bottom:12px"></div>
        <button id="adminLoginButton" type="submit" style="width:100%;border:0;border-radius:10px;padding:13px;background:#151713;color:#fff;font-weight:850;cursor:pointer">Sign in to admin</button>
      </form>
      <p style="margin:18px 0 0;text-align:center;font-size:11px;color:#969b91"><a href="index.html" style="color:#59630e">← Back to website</a></p>
    </section>
  </main>
  <script src="static-demo.js?v=20261011" defer></script>
  <script src="admin-login.js?v=20261011" defer></script>
</body>
</html>
